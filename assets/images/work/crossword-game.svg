<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Crossword puzzle web game interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#301827"/>
      <stop offset="1" stop-color="#130a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="360" height="360" fill="url(#bg)"/>
  <rect width="360" height="360" fill="url(#glow)"/>

  <rect x="28" y="28" width="304" height="304" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- header: title + timer -->
  <rect x="44" y="44" width="66" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.38"/>
  <circle cx="298" cy="48" r="10" fill="none" stroke="#ff5c7a" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M298 43 v5 l4 3" fill="none" stroke="#ff5c7a" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
  <rect x="252" y="44" width="34" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
  <line x1="28" y1="70" x2="332" y2="70" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- 7x7 crossword grid, cell 26 + 2 gap, origin (52, 88) -->
  <g>
    <!-- row 0 -->
    <rect x="52"  y="88"  width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="80"  y="88"  width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="108" y="88"  width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="136" y="88"  width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="164" y="88"  width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="192" y="88"  width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="220" y="88"  width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>

    <!-- row 1 -->
    <rect x="52"  y="116" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="80"  y="116" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="108" y="116" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="136" y="116" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="164" y="116" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="192" y="116" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="220" y="116" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>

    <!-- row 2: active across word -->
    <rect x="52"  y="144" width="26" height="26" rx="2" fill="#ff5c7a" fill-opacity="0.30"/>
    <rect x="80"  y="144" width="26" height="26" rx="2" fill="#ff5c7a" fill-opacity="0.30"/>
    <rect x="108" y="144" width="26" height="26" rx="2" fill="#ff5c7a" fill-opacity="0.55"/>
    <rect x="136" y="144" width="26" height="26" rx="2" fill="#ff5c7a" fill-opacity="0.30"/>
    <rect x="164" y="144" width="26" height="26" rx="2" fill="#ff5c7a" fill-opacity="0.30"/>
    <rect x="192" y="144" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="220" y="144" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>

    <!-- row 3 -->
    <rect x="52"  y="172" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="80"  y="172" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="108" y="172" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="136" y="172" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="164" y="172" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="192" y="172" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="220" y="172" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>

    <!-- row 4 -->
    <rect x="52"  y="200" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="80"  y="200" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="108" y="200" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="136" y="200" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="164" y="200" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="192" y="200" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="220" y="200" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>

    <!-- row 5 -->
    <rect x="52"  y="228" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="80"  y="228" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="108" y="228" width="26" height="26" rx="2" fill="#ff5c7a" fill-opacity="0.30"/>
    <rect x="136" y="228" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="164" y="228" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="192" y="228" width="26" height="26" rx="2" fill="#000000" fill-opacity="0.35"/>
    <rect x="220" y="228" width="26" height="26" rx="2" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <!-- clue panel -->
  <g>
    <rect x="264" y="88" width="52" height="166" rx="7" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="274" y="100" width="24" height="6" rx="3" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="274" y="116" width="32" height="5" rx="2.5" fill="#ff5c7a" fill-opacity="0.70"/>
    <rect x="274" y="130" width="28" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="274" y="144" width="32" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="274" y="158" width="24" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="274" y="180" width="24" height="6" rx="3" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="274" y="196" width="30" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="274" y="210" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="274" y="224" width="32" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- current clue bar -->
  <rect x="52" y="278" width="264" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="66" y="290" width="18" height="6" rx="3" fill="#ff5c7a" fill-opacity="0.85"/>
  <rect x="94" y="290" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.24"/>
</svg>
