<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Realtime collaboration tool interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122b2a"/>
      <stop offset="1" stop-color="#08111a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#2bd97c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2bd97c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="360" height="360" fill="url(#bg)"/>
  <rect width="360" height="360" fill="url(#glow)"/>

  <rect x="28" y="28" width="304" height="304" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- topbar with presence avatars -->
  <rect x="44" y="44" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.40"/>
  <g>
    <circle cx="262" cy="48" r="10" fill="#2bd97c" fill-opacity="0.75" stroke="#0d1a17" stroke-width="2"/>
    <circle cx="280" cy="48" r="10" fill="#4f8cff" fill-opacity="0.75" stroke="#0d1a17" stroke-width="2"/>
    <circle cx="298" cy="48" r="10" fill="#ffa62b" fill-opacity="0.75" stroke="#0d1a17" stroke-width="2"/>
    <circle cx="316" cy="48" r="10" fill="#ffffff" fill-opacity="0.14" stroke="#0d1a17" stroke-width="2"/>
  </g>
  <line x1="28" y1="70" x2="332" y2="70" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- document body -->
  <g>
    <rect x="46" y="90" width="146" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.42"/>

    <rect x="46" y="116" width="238" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="46" y="130" width="212" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>

    <!-- selected range (user A) -->
    <rect x="44" y="148" width="128" height="14" rx="4" fill="#2bd97c" fill-opacity="0.22"/>
    <rect x="46" y="152" width="124" height="6" rx="3" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="180" y="152" width="86" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>

    <rect x="46" y="174" width="196" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>

    <!-- caret (user B) -->
    <rect x="46" y="194" width="104" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="156" y="190" width="2" height="15" fill="#4f8cff"/>

    <rect x="46" y="214" width="228" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="46" y="228" width="160" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- live cursors -->
  <g>
    <path d="M182 158 l0 20 l5 -6 l4 8 l4 -2 l-4 -8 l7 -1 z" fill="#2bd97c"/>
    <rect x="196" y="162" width="40" height="14" rx="7" fill="#2bd97c"/>
  </g>
  <g>
    <path d="M150 206 l0 20 l5 -6 l4 8 l4 -2 l-4 -8 l7 -1 z" fill="#4f8cff"/>
    <rect x="164" y="210" width="34" height="14" rx="7" fill="#4f8cff"/>
  </g>

  <!-- comment thread -->
  <g>
    <rect x="46" y="256" width="190" height="52" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="66" cy="272" r="9" fill="#ffa62b" fill-opacity="0.75"/>
    <rect x="82" y="266" width="46" height="6" rx="3" fill="#ffffff" fill-opacity="0.32"/>
    <rect x="82" y="278" width="132" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="82" y="290" width="98" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- typing indicator -->
  <g fill="#2bd97c">
    <circle cx="256" cy="292" r="4"/>
    <circle cx="270" cy="292" r="4" fill-opacity="0.6"/>
    <circle cx="284" cy="292" r="4" fill-opacity="0.3"/>
  </g>
</svg>
