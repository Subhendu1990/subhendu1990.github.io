<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Analytics dashboard interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191a3c"/>
      <stop offset="1" stop-color="#0b0c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fb0ff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="360" height="360" fill="url(#bg)"/>
  <rect width="360" height="360" fill="url(#glow)"/>

  <!-- app window -->
  <rect x="28" y="28" width="304" height="304" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="46" cy="46" r="3.5" fill="#ffffff" fill-opacity="0.28"/>
  <circle cx="58" cy="46" r="3.5" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="70" cy="46" r="3.5" fill="#ffffff" fill-opacity="0.18"/>
  <line x1="28" y1="64" x2="332" y2="64" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- KPI tiles -->
  <g>
    <rect x="44" y="80" width="86" height="46" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="54" y="90" width="34" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="54" y="102" width="52" height="11" rx="3" fill="#7fb0ff" fill-opacity="0.85"/>

    <rect x="138" y="80" width="86" height="46" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="148" y="90" width="28" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="148" y="102" width="44" height="11" rx="3" fill="#ffffff" fill-opacity="0.55"/>

    <rect x="232" y="80" width="84" height="46" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="242" y="90" width="38" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="242" y="102" width="34" height="11" rx="3" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- chart panel -->
  <rect x="44" y="140" width="272" height="150" rx="8" fill="#ffffff" fill-opacity="0.04"/>

  <!-- gridlines -->
  <g stroke="#ffffff" stroke-opacity="0.07">
    <line x1="60" y1="180" x2="300" y2="180"/>
    <line x1="60" y1="212" x2="300" y2="212"/>
    <line x1="60" y1="244" x2="300" y2="244"/>
  </g>

  <!-- bars -->
  <g fill="url(#bar)">
    <rect x="67"  y="232" width="22" height="44" rx="3"/>
    <rect x="101" y="204" width="22" height="72" rx="3"/>
    <rect x="135" y="220" width="22" height="56" rx="3"/>
    <rect x="169" y="182" width="22" height="94" rx="3"/>
    <rect x="203" y="196" width="22" height="80" rx="3"/>
    <rect x="237" y="166" width="22" height="110" rx="3"/>
    <rect x="271" y="188" width="22" height="88" rx="3"/>
  </g>
  <line x1="60" y1="276" x2="300" y2="276" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- trend line -->
  <polyline points="78,224 112,196 146,210 180,174 214,188 248,158 282,180"
            fill="none" stroke="#00d1e0" stroke-opacity="0.9" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#00d1e0">
    <circle cx="180" cy="174" r="3.5"/>
    <circle cx="248" cy="158" r="3.5"/>
  </g>

  <!-- legend -->
  <g>
    <circle cx="50" cy="308" r="4" fill="#7fb0ff"/>
    <rect x="60" y="305" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.20"/>
    <circle cx="122" cy="308" r="4" fill="#00d1e0"/>
    <rect x="132" y="305" width="34" height="6" rx="3" fill="#ffffff" fill-opacity="0.20"/>
  </g>
</svg>
