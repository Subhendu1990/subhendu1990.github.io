<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="E-commerce storefront interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b2e"/>
      <stop offset="1" stop-color="#0f0b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffa62b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffa62b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa62b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b45" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="360" height="360" fill="url(#bg)"/>
  <rect width="360" height="360" fill="url(#glow)"/>

  <!-- window -->
  <rect x="28" y="28" width="304" height="304" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- top nav: logo, search, cart -->
  <rect x="44" y="42" width="10" height="10" rx="3" fill="#ffa62b"/>
  <rect x="60" y="44" width="32" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="112" y="40" width="128" height="16" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="124" cy="48" r="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <line x1="126.5" y1="50.5" x2="129" y2="53" stroke="#ffffff" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- cart glyph -->
  <path d="M290 42 h6 l5 18 h17 l4 -13 h-24" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="304" cy="65" r="2.5" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="315" cy="65" r="2.5" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="320" cy="42" r="7" fill="#ff5c7a"/>
  <line x1="28" y1="74" x2="332" y2="74" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- product grid 2x2 -->
  <g>
    <!-- card 1 -->
    <rect x="46" y="90" width="128" height="110" rx="8" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="56" y="100" width="108" height="58" rx="6" fill="url(#thumb)"/>
    <rect x="56" y="166" width="72" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="56" y="178" width="46" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="130" y="174" width="34" height="14" rx="7" fill="#ffa62b" fill-opacity="0.85"/>

    <!-- card 2 -->
    <rect x="186" y="90" width="128" height="110" rx="8" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="196" y="100" width="108" height="58" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="196" y="166" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="196" y="178" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="270" y="174" width="34" height="14" rx="7" fill="#ffffff" fill-opacity="0.18"/>

    <!-- card 3 -->
    <rect x="46" y="212" width="128" height="110" rx="8" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="56" y="222" width="108" height="58" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="56" y="288" width="66" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="56" y="300" width="40" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="130" y="296" width="34" height="14" rx="7" fill="#ffffff" fill-opacity="0.18"/>

    <!-- card 4 -->
    <rect x="186" y="212" width="128" height="110" rx="8" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="196" y="222" width="108" height="58" rx="6" fill="url(#thumb)"/>
    <rect x="196" y="288" width="54" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="196" y="300" width="48" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="270" y="296" width="34" height="14" rx="7" fill="#ffa62b" fill-opacity="0.85"/>
  </g>
</svg>
